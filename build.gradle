plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.graalvm.buildtools.native' version '1.1.8'
}

group = 'banghak.home.halley'
version = '0.0.1-SNAPSHOT'
description = 'Halley'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', "2025.1.3")
}

dependencies {
    // 국토부 규제지역 고시는 본문이 아니라 첨부 PDF에 현황표로 들어 있다 (설계 I73)
    implementation 'org.apache.pdfbox:pdfbox:3.0.3'

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-mustache'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-jooq'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'net.coobird:thumbnailator:0.4.20'
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j'
    implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer'
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()

    // SchemaSyncTest 가 이 파일들을 읽는다. 입력으로 걸어 두지 않으면 DDL 만 고쳤을 때
    // Gradle 이 test 를 UP-TO-DATE 로 건너뛴다 — 어긋난 것을 확인할 기회 자체가 없다.
    inputs.files('docs/DDL.sql', 'docs/DDL-repair.sql')
            .withPropertyName('ddlFiles')
            .withPathSensitivity(PathSensitivity.RELATIVE)
}

// app.js 시험 (설계 I276) — test/check/build 에는 안 묶는다, Node 없는 배포 환경도 있다
tasks.register('jsInstall', Exec) {
    inputs.file('package.json')
    outputs.dir('node_modules')
    commandLine 'npm', 'install', '--no-audit', '--no-fund'
}

tasks.register('jsTest', Exec) {
    dependsOn tasks.named('jsInstall')
    inputs.dir('src/test/js')
    inputs.dir('src/main/resources/static/js')
    commandLine 'npm', 'test'
}
