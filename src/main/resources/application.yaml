spring:
  application:
    name: Halley
  profiles:
    default: local
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

server:
  servlet:
    session:
      timeout: 30m

# 알림에 붙일 매물 주소의 앞부분 (설계 I189). 비우면 링크를 안 단다 —
# 서버는 자기 주소를 모르므로 알려 줘야 한다
app:
  base-url: ${APP_BASE_URL:}

kakao:
  js-key: ${KAKAO_JS_KEY:}
  rest-key: ${KAKAO_REST_KEY:}
  local:
    base-url: https://dapi.kakao.com
  directions:
    base-url: https://apis-navi.kakaomobility.com

odsay:
  api-key: ${ODSAY_API_KEY:}
  base-url: https://api.odsay.com
  transit-path: /v1/api/searchPubTransPathT
  # 경로선 (설계 I177). 지도에 실제 동선을 그릴 때만 부른다
  lane-path: /v1/api/loadLane

ministry:
  reference:
    # 국토부 API는 한 달치만 준다. 이만큼 거슬러 훑는다 (설계 I98).
    # 한 달에 한 번씩 부르므로 이 값이 그대로 호출 횟수다 — 늘리면 그만큼 느려진다
    lookback-months: ${MINISTRY_LOOKBACK_MONTHS:12}
  service-key: ${MINISTRY_API_KEY:}
  base-url: https://apis.data.go.kr/1613000
  # 국토부는 초당 요청 수를 센다 (설계 I140).
  #   LIMITED_NUMBER_OF_SERVICE_REQUESTS_PER_SECOND_EXCEEDS_ERROR
  # 동시 실행 상한(forecast.max-concurrency)만으로는 못 막는다 — 6으로 묶어도
  # 각 호출이 40ms 에 끝나면 초당 150건이 나간다. 실제로 그렇게 나가서 전부 429를 받았다.
  # 전망(60개월)과 실거래 카드(12개월)가 같은 키를 쓰므로 이 제한도 같이 나눠 쓴다.
  # 0 이하면 제한하지 않는다
  permits-per-second: ${MINISTRY_PERMITS_PER_SECOND:4}

# 국토교통부 공동주택/개별주택 공시가격 (V-World 국가공간정보 개방데이터) — 설계 I54
vworld:
  api-key: ${HOUSING_PRICE_API_KEY:}
  base-url: https://api.vworld.kr

feign:
  client:
    config:
      default:
        connectTimeout: 2000
        readTimeout: 5000
      kakao-local:
        connectTimeout: 3000
        readTimeout: 6000
        loggerLevel: BASIC
      kakao-directions:
        connectTimeout: 3000
        readTimeout: 6000
      odsay:
        connectTimeout: 5000
        readTimeout: 15000
      ministry-reference:
        connectTimeout: 3000
        readTimeout: 8000
      vworld-housing-price:
        connectTimeout: 3000
        readTimeout: 8000
      vworld-land-use:
        connectTimeout: 3000
        readTimeout: 8000
      claude-llm:
        connectTimeout: 5000
        # LLM은 생성에 시간이 걸린다. 비동기 보정에서만 부르므로 길게 잡아도 화면을 막지 않는다
        readTimeout: 60000

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
    instances:
      kakao-local:
        baseConfig: default
        failureRateThreshold: 40
        waitDurationInOpenState: 15s
      kakao-directions:
        baseConfig: default
        failureRateThreshold: 40
        waitDurationInOpenState: 15s
      odsay:
        baseConfig: default
        slidingWindowSize: 5
        failureRateThreshold: 30
        waitDurationInOpenState: 60s
        permittedNumberOfCallsInHalfOpenState: 2
      slack-webhook:
        baseConfig: default
        slidingWindowSize: 5
        failureRateThreshold: 30
        waitDurationInOpenState: 60s
        permittedNumberOfCallsInHalfOpenState: 2
      ministry-reference:
        baseConfig: default
        failureRateThreshold: 40
        waitDurationInOpenState: 30s
      vworld-housing-price:
        baseConfig: default
        failureRateThreshold: 40
        waitDurationInOpenState: 30s
      vworld-land-use:
        baseConfig: default
        failureRateThreshold: 40
        waitDurationInOpenState: 30s
      claude-llm:
        baseConfig: default
        slidingWindowSize: 5
        failureRateThreshold: 40
        waitDurationInOpenState: 60s
        permittedNumberOfCallsInHalfOpenState: 2

  timelimiter:
    configs:
      default:
        timeoutDuration: 15s
        cancelRunningFuture: true
    instances:
      kakao-local:
        baseConfig: default
      kakao-directions:
        baseConfig: default
      odsay:
        baseConfig: default
        timeoutDuration: 20s
      slack-webhook:
        baseConfig: default
      ministry-reference:
        baseConfig: default
      vworld-housing-price:
        baseConfig: default
      vworld-land-use:
        baseConfig: default
      claude-llm:
        baseConfig: default
        timeoutDuration: 70s

llm:
  enabled: ${LLM_ENABLED:true}
  provider: ${LLM_PROVIDER:claude}
  claude:
    api-key: ${ANTHROPIC_API_KEY:}
    base-url: https://api.anthropic.com
    model: ${LLM_CLAUDE_MODEL:claude-opus-5}
    # 요즘 모델은 temperature 를 받지 않는다 (설계 I144).
    #   400 `temperature` is deprecated for this model.
    # 받는 모델로 내려갈 때만 켠다. 같은 지표에 같은 답은 프롬프트 해시(I59)가 지킨다
    send-temperature: ${LLM_CLAUDE_SEND_TEMPERATURE:false}

# 알림은 그룹마다 자기 웹훅으로 나간다 (설계 I96). 전역 주소는 없다
slack:
  enabled: ${SLACK_ENABLED:false}
  notify:
    # 등록 알림만 따로 끌 수 있다. 보정이 끝나기 전에 보내면 반쯤 빈 카드가 간다
    property-created: ${SLACK_NOTIFY_PROPERTY_CREATED:false}

# 법제처 국가법령정보 — 규제지역 고시 조회 (설계 I73). OC는 키가 아니라 이메일 ID다
# base-url은 https여야 한다 — http는 301로 넘기는데 Feign이 프로토콜 전환을 안 따라간다
law:
  oc: ${LAW_OC:}
  base-url: https://www.law.go.kr

# 금융감독원 금융상품통합비교공시 — 주담대·전세 공시 금리 (설계 I77)
fss:
  api-key: ${FSS_API_KEY:}
  base-url: https://finlife.fss.or.kr/finlifeapi

# 회원가입 개방 여부 (설계 I95). false면 화면에서 숨기고 API도 막는다
ecos:
  # 한국은행 경제통계시스템 (설계 I116). 스트레스 DSR의 기준 금리를 여기서 만든다
  base-url: https://ecos.bok.or.kr/api
  api-key: ${ECOS_KEY:}
  # 예금은행 대출금리(신규취급액 기준)
  stat-code: ${ECOS_STAT_CODE:121Y006}
  item-code:
    # BECBLA03 = 가계대출. 규제식이 말하는 '가계대출 금리'가 이것이다.
    # 주택담보대출만 보려면 BECBLA0302, 변동형만 보려면 BECBLA030202
    household-loan: ${ECOS_HOUSEHOLD_ITEM:BECBLA03}

loan:
  stress-rate:
    # clamp(과거 5년 최고 가계대출금리 − 현재, 하한, 상한). 고시가 바뀌면 여기만 고친다
    floor: ${LOAN_STRESS_FLOOR:0.015}
    cap: ${LOAN_STRESS_CAP:0.030}

forecast:
  # 가격 전망 (docs/PRICE_FORECAST.md)
  # 실거래를 이만큼 거슬러 훑는다. 이 값이 그대로 국토부 호출 횟수다 —
  # 다만 법정동·월 단위로 캐시되므로(설계 I128) 두 번째 매물부터는 거의 안 부른다
  lookback-months: ${FORECAST_LOOKBACK_MONTHS:60}
  # 판단 작업이라 흔들리면 안 된다 (설계 I127). 비우면 llm.claude.model 을 쓴다
  # 몇 개월 앞을 보는가. 화면과 프롬프트에 그대로 나간다
  horizon-months: ${FORECAST_HORIZON_MONTHS:12}
  # 전망 전용 동시 실행 상한 (설계 I129). 보정(400)과 따로 둔다 —
  # 한 매물에 60번을 던지므로 같은 줄에 세우면 다른 매물의 보정이 밀린다.
  # 공공 API에 60건을 한꺼번에 던지면 429가 온다
  max-concurrency: ${FORECAST_MAX_CONCURRENCY:6}
  # 국토부 신고 지연 때문에 최근 몇 달은 다시 받는다. 그 이전은 바뀌지 않는다
  refetch-recent-months: ${FORECAST_REFETCH_MONTHS:3}
  # 전망을 다시 내는 주기 (설계 I143). 등록 때 한 번 내고 끝이면 반년 지난 매물의
  # 화살표가 반년 전 시장을 가리킨다. 매월 15일 — 국토부 신고 기한이 계약 후 30일이라
  # 월초에는 지난달 자료가 덜 찬다. 대개 값이 싸다: 새로 받을 달은 서너 달뿐이고(I128)
  # 지표가 그대로면 프롬프트 해시가 같아 LLM 을 부르지 않는다(I59)
  # 답의 토큰 상한 (설계 I149). 모자라면 JSON 중간에서 잘려 파싱이 실패한다 —
  # 1500 으로 뒀다가 운영에서 정확히 다 쓰고 잘렸다. 요인이 여섯으로 늘어(I148) 답이
  # 길어진 데다, 요즘 모델은 생각(thinking)에도 예산을 쓴다 (그날 549 토큰)
  max-tokens: ${FORECAST_MAX_TOKENS:4000}
  monthly-refresh-cron: ${FORECAST_REFRESH_CRON:0 15 4 15 * *}
  monthly-refresh-enabled: ${FORECAST_REFRESH_ENABLED:true}
  # 이 연식 이상이라야 용적률 여유를 재건축 여력으로 본다 (설계 I132).
  # 신축에 여유가 크다고 재건축 호재가 아니다 — 실측에서 2015년 준공 단지의
  # 여유가 127%p였는데 재건축은 수십 년 뒤 이야기다
  redevelopment-age-years: ${FORECAST_REDEVELOPMENT_AGE:30}
  # 최근 달을 다시 받는 주기
  refetch-after-hours: ${FORECAST_REFETCH_HOURS:24}

building:
  # 국토교통부 건축물대장정보 서비스 (설계 I132).
  # 실거래가와 같은 인증키(MINISTRY_API_KEY)를 쓰지만 다른 서비스라
  # 공공데이터포털에서 따로 활용신청해야 한다
  base-url: https://apis.data.go.kr/1613000/BldRgstHubService

naver:
  # 네이버 검색 API — 관련 기사 (설계 I137).
  # developers.naver.com 에서 애플리케이션 등록 후 발급. 승인 절차는 없다.
  # 기사는 점수에도 LLM 프롬프트에도 넣지 않는다 — 링크 목록으로만 쓴다
  base-url: https://openapi.naver.com/v1/search
  client-id: ${NAVER_CLIENT_ID:}
  client-secret: ${NAVER_CLIENT_SECRET:}
  news-limit: ${NAVER_NEWS_LIMIT:10}

enrichment:
  # 보정 단계를 가상 스레드로 동시에 돌릴 때의 총 동시 실행 상한 (설계 I108).
  # 스레드가 아니라 그 끝에 붙은 외부 API를 지키려는 값이다 — 넘어선 작업은
  # 거절되지 않고 자리가 날 때까지 기다린다
  max-concurrency: ${ENRICHMENT_MAX_CONCURRENCY:400}

membership:
  sign-up:
    open: ${MEMBERSHIP_SIGN_UP_OPEN:true}

# ── 로깅 (설계 I162) ────────────────────────────────────────────────
# 자세한 출력 모양·파일 회전은 logback-spring.xml 에 있다. 여기는 무엇을 얼마나
# 남길지만 정한다.
logging:
  file:
    # live 에서만 파일을 쓴다 (logback-spring.xml). 상대경로면 작업 디렉터리 기준
    path: ${LOG_PATH:logs}
  level:
    root: INFO
    # 우리 코드는 INFO. 배경 작업이 어디까지 갔는지가 여기서 보인다
    banghak.home.halley: ${LOG_LEVEL_APP:INFO}
    # 기동 때만 시끄럽고 그 뒤로는 쓸모가 적다
    org.springframework: WARN
    org.springframework.boot.autoconfigure: WARN
    org.apache.catalina: WARN
    com.zaxxer.hikari: WARN
    # 커넥션 풀이 마르면 이건 봐야 한다
    com.zaxxer.hikari.pool.HikariPool: INFO
    # jOOQ 는 기본으로 조용히. 쿼리를 세야 할 때만 DEBUG 로 올린다 (설계 I124)
    org.jooq: WARN
    org.jooq.tools.LoggerListener: ${LOG_LEVEL_SQL:WARN}
    # Feign 이 요청 URL 을 남기면 인증키가 새어 나간다 (설계 I140)
    feign: WARN
    org.springframework.cloud.openfeign: WARN
