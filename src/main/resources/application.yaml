spring:
  application:
    name: Halley
  profiles:
    default: local
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

server:
  servlet:
    session:
      timeout: 30m

kakao:
  js-key: ${KAKAO_JS_KEY:}
  rest-key: ${KAKAO_REST_KEY:}
  local:
    base-url: https://dapi.kakao.com
  directions:
    base-url: https://apis-navi.kakaomobility.com

odsay:
  api-key: ${ODSAY_API_KEY:}
  base-url: https://api.odsay.com
  transit-path: /v1/api/searchPubTransPathT

ministry:
  service-key: ${MINISTRY_API_KEY:}
  base-url: https://apis.data.go.kr/1613000

# 국토교통부 공동주택/개별주택 공시가격 (V-World 국가공간정보 개방데이터) — 설계 I54
vworld:
  api-key: ${HOUSING_PRICE_API_KEY:}
  base-url: https://api.vworld.kr

feign:
  client:
    config:
      default:
        connectTimeout: 2000
        readTimeout: 5000
      kakao-local:
        connectTimeout: 3000
        readTimeout: 6000
        loggerLevel: BASIC
      kakao-directions:
        connectTimeout: 3000
        readTimeout: 6000
      odsay:
        connectTimeout: 5000
        readTimeout: 15000
      ministry-reference:
        connectTimeout: 3000
        readTimeout: 8000
      vworld-housing-price:
        connectTimeout: 3000
        readTimeout: 8000
      vworld-land-use:
        connectTimeout: 3000
        readTimeout: 8000
      claude-llm:
        connectTimeout: 5000
        # LLM은 생성에 시간이 걸린다. 비동기 보정에서만 부르므로 길게 잡아도 화면을 막지 않는다
        readTimeout: 60000

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
    instances:
      kakao-local:
        baseConfig: default
        failureRateThreshold: 40
        waitDurationInOpenState: 15s
      kakao-directions:
        baseConfig: default
        failureRateThreshold: 40
        waitDurationInOpenState: 15s
      odsay:
        baseConfig: default
        slidingWindowSize: 5
        failureRateThreshold: 30
        waitDurationInOpenState: 60s
        permittedNumberOfCallsInHalfOpenState: 2
      slack-webhook:
        baseConfig: default
        slidingWindowSize: 5
        failureRateThreshold: 30
        waitDurationInOpenState: 60s
        permittedNumberOfCallsInHalfOpenState: 2
      ministry-reference:
        baseConfig: default
        failureRateThreshold: 40
        waitDurationInOpenState: 30s
      vworld-housing-price:
        baseConfig: default
        failureRateThreshold: 40
        waitDurationInOpenState: 30s
      vworld-land-use:
        baseConfig: default
        failureRateThreshold: 40
        waitDurationInOpenState: 30s
      claude-llm:
        baseConfig: default
        slidingWindowSize: 5
        failureRateThreshold: 40
        waitDurationInOpenState: 60s
        permittedNumberOfCallsInHalfOpenState: 2

  timelimiter:
    configs:
      default:
        timeoutDuration: 15s
        cancelRunningFuture: true
    instances:
      kakao-local:
        baseConfig: default
      kakao-directions:
        baseConfig: default
      odsay:
        baseConfig: default
        timeoutDuration: 20s
      slack-webhook:
        baseConfig: default
      ministry-reference:
        baseConfig: default
      vworld-housing-price:
        baseConfig: default
      vworld-land-use:
        baseConfig: default
      claude-llm:
        baseConfig: default
        timeoutDuration: 70s

llm:
  enabled: ${LLM_ENABLED:true}
  provider: ${LLM_PROVIDER:claude}
  claude:
    api-key: ${ANTHROPIC_API_KEY:}
    base-url: https://api.anthropic.com
    model: ${LLM_CLAUDE_MODEL:claude-opus-5}

slack:
  enabled: ${SLACK_ENABLED:false}
  webhook-url: ${SLACK_WEBHOOK_URL:}
  notify:
    property-created: ${SLACK_NOTIFY_PROPERTY_CREATED:false}
    sold-out: ${SLACK_NOTIFY_SOLD_OUT:false}

# 법제처 국가법령정보 — 규제지역 고시 조회 (설계 I73).
law:
  oc: ${LAW_OC:}
  base-url: http://www.law.go.kr

# 금융감독원 금융상품통합비교공시 (설계 I77).
# 주담대·전세자금대출의 실제 공시 금리를 회사·조건별로 받는다.
fss:
  api-key: ${FSS_API_KEY:}
  base-url: http://finlife.fss.or.kr/finlifeapi
