spring:
  application:
    name: Halley
  profiles:
    default: local
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

server:
  servlet:
    session:
      timeout: 30m

feign:
  client:
    config:
      default:
        connectTimeout: 2000
        readTimeout: 5000
      kakao-local:
        connectTimeout: 3000
        readTimeout: 6000
        loggerLevel: BASIC
      odsay:
        connectTimeout: 5000
        readTimeout: 15000
      ministry-reference:
        connectTimeout: 3000
        readTimeout: 8000

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
    instances:
      kakao-local:
        baseConfig: default
        failureRateThreshold: 40
        waitDurationInOpenState: 15s
      odsay:
        baseConfig: default
        slidingWindowSize: 5
        failureRateThreshold: 30
        waitDurationInOpenState: 60s
        permittedNumberOfCallsInHalfOpenState: 2
      slack-webhook:
        baseConfig: default
        slidingWindowSize: 5
        failureRateThreshold: 30
        waitDurationInOpenState: 60s
        permittedNumberOfCallsInHalfOpenState: 2
      ministry-reference:
        baseConfig: default
        failureRateThreshold: 40
        waitDurationInOpenState: 30s

slack:
  enabled: ${SLACK_ENABLED:false}
  webhook-url: ${SLACK_WEBHOOK_URL:}
  notify:
    property-created: ${SLACK_NOTIFY_PROPERTY_CREATED:false}
    sold-out: ${SLACK_NOTIFY_SOLD_OUT:false}
