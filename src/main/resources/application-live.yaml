spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/halley}
    driver-class-name: org.postgresql.Driver
    # 기본값을 두지 않는다 (설계 I296) — 없으면 기동이 실패한다. halley/halley 로 조용히 뜨는 것보다 낫다
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: ${DB_POOL_TIMEOUT_MS:3000}
  sql:
    init:
      mode: never
  jooq:
    sql-dialect: POSTGRES
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  servlet:
    session:
      cookie:
        # HTTPS 로만 세션 쿠키를 보낸다 (설계 I297). 로컬은 http 라 여기(live)에만 둔다
        secure: true
  # 프록시(nginx·ALB) 뒤에서 X-Forwarded-* 를 믿는다 (설계 I297). 없으면 isSecure() 가
  # false 라 Secure 쿠키가 안 나가고, 로그인 제한이 프록시 주소 하나로 묶인다
  forward-headers-strategy: native
